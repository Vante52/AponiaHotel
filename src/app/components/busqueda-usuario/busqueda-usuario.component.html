<section class="search-section">
  <div class="search-wrapper">
    <div class="search-box">
      <i class="search-icon">🔍</i>
      <input 
        type="text" 
        class="search-input"
        placeholder="Buscar usuario por username..."
        [(ngModel)]="username"
        (keyup)="onKeyPress($event)">
      <button 
        class="search-button"
        (click)="onSearch()">
        Buscar
      </button>
    </div>
    <p class="search-hint">Ejemplos: stellas, samanthah, harpert</p>
  </div>
</section>
