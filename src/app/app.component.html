<div class="app-container">
  <!-- Header simple -->
  <header class="app-header">
    <h1 class="app-title">Aplicación</h1>
  </header>

  <main class="app-main">
    <!-- Barra de búsqueda centrada y grande -->
    <div class="search-container">
      <app-busqueda-usuario (search)="onSearchUser($event)"></app-busqueda-usuario>
    </div>

    <!-- Estados -->
    <div *ngIf="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Buscando usuario...</p>
    </div>

    <div *ngIf="error" class="error-state">
      {{ error }}
    </div>

    <!-- Perfil y Posts -->
    <app-perfil-usuario *ngIf="user && !loading" [user]="user"></app-perfil-usuario>
    <app-posts-usuario 
      *ngIf="posts.length > 0 && !loading"
      [posts]="posts"
      [user]="user">  
    </app-posts-usuario>

    <!-- Mensaje de bienvenida -->
    <div *ngIf="!loading && !error && !user && posts.length === 0" class="welcome-state">
      <h2>Buscar Usuarios</h2>
      <p>Ingresa un username para ver el perfil y publicaciones</p>
    </div>
  </main>
</div>
